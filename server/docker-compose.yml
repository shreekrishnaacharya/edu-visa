services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eduvisa
      POSTGRES_PASSWORD: eduvisa
      POSTGRES_DB: eduvisa
    ports:
      - "5432:5432"
    volumes:
      - ../docker/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduvisa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ../docker/redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eduvisa
      MINIO_ROOT_PASSWORD: eduvisa-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../docker/minio:/data

  # The API itself — NOT started by a bare `docker compose up` (keeps the
  # default dev flow as `npm run start:dev` against these infra containers).
  # Run the whole stack containerized with: `docker compose --profile full up -d --build`
  app:
    profiles: ["full"]
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      S3_ENDPOINT: minio
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

# No top-level `volumes:` — db/redis/minio data lives under ../docker/ as
# plain bind-mounted folders (not opaque Docker-managed volumes), so the
# entire project directory is self-contained and portable: stop the stack,
# zip the repo (or just the `docker/` folder), copy it anywhere, unzip, and
# `docker compose up` picks the exact same data back up. See DEPLOYMENT.md.
